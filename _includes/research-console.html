<section class="research-console page-agent page-agent-bottom" aria-label="Linxin's page agent" data-endpoint="{{ site.page_agent_endpoint | default: '' | escape }}">
  <div class="page-agent-shell">
    <div class="page-agent-top"><span class="page-agent-brand">LINXIN <span class="page-agent-slash">/</span> PERSONAL AGENT</span><span class="page-agent-status" role="status">CONNECTING</span><button class="page-agent-minimize" type="button" aria-label="Show conversation" aria-controls="page-agent-session" aria-expanded="false" hidden>+</button></div>
    <div class="page-agent-session" id="page-agent-session" hidden>
      <div class="page-agent-history" aria-label="Previous conversation"></div>
      <div class="page-agent-current">
      <div class="page-agent-question"></div>
      <details class="page-agent-thinking" hidden open>
        <summary class="page-agent-thinking-label"><span class="page-agent-work-label">Thinking</span><span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span></summary>
        <ol class="page-agent-trace" role="log" aria-live="polite" aria-atomic="false" aria-label="Agent progress and tool calls"></ol>
      </details>
      <div class="page-agent-answer" aria-live="polite" aria-atomic="true"></div>
      <div class="page-agent-sources" aria-label="Answer sources"></div>
      </div>
    </div>
    <div class="page-agent-resize" role="separator" tabindex="0" aria-label="Resize message input" aria-controls="page-agent-question" aria-orientation="horizontal" aria-valuemin="34" aria-valuemax="240" aria-valuenow="34" title="Drag upward to enlarge · Arrow Up / Down to resize"></div>
    <form class="page-agent-form">
      <label class="visually-hidden" for="page-agent-question">Ask about Linxin Song</label>
      <textarea id="page-agent-question" name="question" rows="1" maxlength="1200" placeholder="Ask me anything. e.g. Leave me a message · Explore my research · Compare papers" required></textarea>
      <div class="page-agent-form-actions"><button class="page-agent-stop" type="button" hidden>Stop</button><button class="page-agent-send" type="submit" disabled>Ask <span aria-hidden="true">↗</span></button></div>
    </form>
    <div class="page-agent-conversation-bar"><span class="page-agent-quota" role="status" title="Checking your remaining questions…">— / 20 questions left today</span><button class="page-agent-new-chat" type="button">New chat</button></div>
    <noscript><p class="page-agent-intro">Enable JavaScript to use the page agent. All profile information is available above.</p></noscript>
  </div>
</section>
