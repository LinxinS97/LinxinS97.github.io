name: Agent safety checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Scan source and reachable history for credentials
        run: node _agent/scan-secrets.mjs --history
      - name: Verify agent boundaries and quotas
        run: node --test _agent/*.test.mjs
